services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuclei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nuclei}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuclei} -d ${POSTGRES_DB:-nuclei}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    pull_policy: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nuclei}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nuclei}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SCANNER_TOKEN: ${SCANNER_TOKEN:?Set SCANNER_TOKEN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://10.150.10.155:8118}
      AGENT_IMAGE: ${AGENT_IMAGE:-nuclei-dashboard-agent:latest}
      AGENT_GIT_CONTEXT: ${AGENT_GIT_CONTEXT:-https://github.com/JustinTDCT/nuclei-dashboard.git#956d510385b26d9715daa43ea1e2d0d733e0a56b:scan_runtime}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      AGENT_TLS_VERIFY: ${AGENT_TLS_VERIFY:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://localhost:8118,https://10.150.10.155:8118}
      NVD_API_KEY: ${NVD_API_KEY:-}
      RAW_ARTIFACT_DIR: ${RAW_ARTIFACT_DIR:-/var/lib/nuclei-dashboard/raw-artifacts}
      RAW_ARTIFACT_MAX_BYTES: ${RAW_ARTIFACT_MAX_BYTES:-268435456}
    volumes:
      - scan-artifacts:/var/lib/nuclei-dashboard/raw-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: ./frontend
    pull_policy: build
    depends_on:
      - api
    restart: unless-stopped

  scanner:
    build: ./scan_runtime
    image: nuclei-dashboard-agent:latest
    pull_policy: build
    command: ["python", "scanner_main.py"]
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      CENTRAL_URL: http://api:8000
      SCANNER_TOKEN: ${SCANNER_TOKEN:?Set SCANNER_TOKEN in .env}
      SCAN_DRY_RUN: ${SCAN_DRY_RUN:-0}
      HOME: /home/scanner
      AGENT_DATA_DIR: /data
    volumes:
      - scanner-data:/data
      - nuclei-templates:/home/scanner/nuclei-templates
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # LAN site agent. Not started by default.
  # On the LAN host: sudo docker compose --profile lan-agent up -d --build nuclei-agent
  # The Agent image includes an independent heartbeat/control loop. Rebuild
  # this image after scan_runtime control-plane changes.
  nuclei-agent:
    profiles: ["lan-agent"]
    image: nuclei-dashboard-agent:latest
    pull_policy: build
    build: ./scan_runtime
    command: ["python", "agent_main.py"]
    restart: unless-stopped
    network_mode: host
    # Host networking reaches site RFC1918. The process is uid 1000 with
    # only NET_RAW so Naabu SYN/host-discovery can open raw sockets.
    # Do not add privileged: true. The WAN scanner stays bridged.
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      CENTRAL_URL: ${AGENT_CENTRAL_URL:-${PUBLIC_URL:-https://10.150.10.155:8118}}
      AGENT_UUID: ${AGENT_UUID:-}
      ENROLLMENT_SECRET: ${ENROLLMENT_SECRET:-}
      TLS_VERIFY: ${AGENT_TLS_VERIFY:-1}
      TLS_CA_FILE: ${TLS_CA_FILE:-}
      SCAN_DRY_RUN: "0"
      AGENT_DATA_DIR: /data
      HOME: /home/scanner
    volumes:
      - agent-keys:/data
      - nuclei-templates:/home/scanner/nuclei-templates
      - ${TLS_CA_HOST_DIR:-./agent-certs}:/certs:ro

  caddy:
    image: caddy:2-alpine
    ports:
      - "8118:8118"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-https://10.150.10.155:8118}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  nuclei-templates:
  agent-keys:
  scanner-data:
  scan-artifacts:
